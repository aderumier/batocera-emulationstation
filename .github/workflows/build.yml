name: Build

on:
  push:
    branches:
      - fix-api
  pull_request:
    branches:
      - fix-api

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libfreeimage-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libvlc-dev \
            rapidjson-dev \
            libasound2-dev \
            libgl-dev \
            libudev-dev \
            gettext

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGL=ON \
            -DBATOCERA=ON \
            -DENABLE_FILEMANAGER=OFF \
            -DDISABLE_KODI=OFF \
            -DENABLE_PULSE=OFF \
            -DCEC=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Find binary
        run: find build -type f -executable | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-ubuntu-24.04
          path: build/emulationstation
